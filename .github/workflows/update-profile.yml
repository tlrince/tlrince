name: Update profile

on:
  schedule:
    - cron: "0 16 * * *" # 每天北京时间 00:00
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/**]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/ocean.svg?palette=github-light&color_snake=#c8312b&color_dots=#e6eef5,#b6d4ea,#7fb6d9,#2f6f9f,#1d4e78
            dist/ocean-dark.svg?palette=github-dark&color_snake=#f0c94a&color_dots=#161b22,#0e3a5c,#1d4e78,#2f6f9f,#7fb6d9
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
